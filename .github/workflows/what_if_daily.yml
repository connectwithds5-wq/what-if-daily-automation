name: WHAT IF DAILY

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Growth strategy slot"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: what-if-daily-topic
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      GEMINI_IMAGE_FALLBACK_MODEL: gemini-3-pro-image
      GEMINI_IMAGE_FALLBACK_2_MODEL: gemini-2.5-flash-image
      VISUALS_ENABLED: "true"
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
      RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '30 13 * * *' && '0' || '1') }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install google-genai requests

      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "YOUTUBE_OAUTH_JSON is missing"; exit 1; }
          echo "Required Gemini and YouTube upload credentials are present."

      - name: Refresh AI strategy from YouTube analytics
        run: |
          python src/analytics_strategy.py
          if [ -f growth_strategy.json ]; then
            echo "Strategy file available for this posting run."
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add growth_strategy.json
            if [ -f analytics_history.json ]; then
              git add analytics_history.json
            fi
            if git diff --cached --quiet; then
              echo "Analytics strategy unchanged."
            else
              git commit -m "Refresh WHAT IF analytics strategy"
              git push
            fi
          else
            echo "No refreshed strategy file; existing strategy will be used."
          fi

      - name: Normalize production source
        run: |
          python scripts/normalize_production.py
          git diff --check
          python -m py_compile src/what_if_daily_v2.py
          python -m py_compile scripts/normalize_production.py
          git add src/what_if_daily_v2.py
          if git diff --cached --quiet; then
            echo "Production source already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Normalize analytics-driven production pipeline"
            git push
          fi

      - name: Apply narration word-limit safety patch
        run: |
          python scripts/enforce_story_word_limit.py
          python -m py_compile src/what_if_daily_v2.py
          git diff --check

      - name: Validate workflow and Python
        run: |
          python - <<'PY'
          import yaml
          with open(".github/workflows/what_if_daily.yml", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("Workflow YAML parse OK.")
          PY
          python -m py_compile src/what_if_daily_v2.py
          python -m py_compile scripts/normalize_production.py
          python -m py_compile scripts/enforce_story_word_limit.py
          python -m py_compile src/analytics_strategy.py
          echo "Python syntax checks PASSED."

      - name: Audio filter smoke test
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=3" \
            -f lavfi -i "sine=frequency=120:duration=3" \
            -filter_complex "[0:a]volume=1.0,asplit=2[n][sc];[1:a]volume=0.68[m];[m][sc]sidechaincompress=threshold=0.04:ratio=5:attack=18:release=260:makeup=1:mix=0.82[duck];[n][duck]amix=inputs=2:duration=first:dropout_transition=0.8,loudnorm=I=-15.5:TP=-1.2:LRA=8[a]" \
            -map "[a]" -t 3 -f null -
          echo "FFmpeg audio sidechain smoke test PASSED."

      - name: Generate WHAT IF DAILY V2 video
        run: python src/what_if_daily_v2.py

      - name: Save topic history
        if: success()
        run: |
          if [ ! -f topic_history.json ]; then
            echo "No topic history file created; nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
          else
            git commit -m "Reserve WHAT IF DAILY topic"
            git push
          fi

      - name: Cleanup generated files
        if: always()
        run: rm -rf output
