name: WHAT IF DAILY

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: what-if-daily-topic
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      GEMINI_IMAGE_ENABLED: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CLOUDFLARE_IMAGE_FALLBACK_MODEL: "@cf/bytedance/stable-diffusion-xl-lightning"
      CLOUDFLARE_IMAGE_FALLBACK_2_MODEL: "@cf/stabilityai/stable-diffusion-xl-base-1.0"
      CLOUDFLARE_IMAGE_FALLBACK_3_MODEL: "@cf/lykon/dreamshaper-8-lcm"
      VISUALS_ENABLED: "true"
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      RUN_SLOT: ${{ github.event.schedule == '30 13 * * *' && '0' || '1' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "YOUTUBE_OAUTH_JSON is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "Gemini 3.6 story/TTS/upload and Cloudflare visual credentials are present."
          echo "Gemini native image generation is disabled."

      - name: Normalize production source
        run: |
          python scripts/normalize_production.py
          python scripts/install_visual_qc.py
          git diff --check
          python -m py_compile src/what_if_daily_v2.py
          python -m py_compile scripts/normalize_production.py
          python -m py_compile scripts/install_visual_qc.py
          git add src/what_if_daily_v2.py
          if git diff --cached --quiet; then
            echo "Production source already normalized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Simplify production visual fallback"
            git push
          fi

      - name: Validate workflow and Python
        run: |
          python - <<'PY'
          import yaml
          with open(".github/workflows/what_if_daily.yml", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("Workflow YAML parse OK.")
          PY
          python -m py_compile src/what_if_daily_v2.py
          python -m py_compile scripts/normalize_production.py
          python -m py_compile scripts/install_visual_qc.py
          echo "Python syntax checks PASSED."

      - name: Audio filter smoke test
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=3" \
            -f lavfi -i "sine=frequency=120:duration=3" \
            -filter_complex "[0:a]volume=1.0,asplit=2[n][sc];[1:a]volume=0.68[m];[m][sc]sidechaincompress=threshold=0.04:ratio=5:attack=18:release=260:makeup=1:mix=0.82[duck];[n][duck]amix=inputs=2:duration=first:dropout_transition=0.8,loudnorm=I=-15.5:TP=-1.2:LRA=8[a]" \
            -map "[a]" -t 3 -f null -
          echo "FFmpeg audio sidechain smoke test PASSED."

      - name: Generate WHAT IF DAILY V2 video
        run: python src/what_if_daily_v2.py

      - name: Production QC and file verification
        run: |
          test -s output/what_if_daily.mp4
          test -s output/metadata.json
          test -s output/visual_qc.json
          ffprobe -v error -show_streams -show_format -of json output/what_if_daily.mp4 > output/final_probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path("output/final_probe.json").read_text())
          streams = probe.get("streams", [])
          video = next((x for x in streams if x.get("codec_type") == "video"), None)
          audio = next((x for x in streams if x.get("codec_type") == "audio"), None)
          if not video or not audio:
              raise SystemExit("QC failed: video/audio stream missing")
          if (int(video.get("width", 0)), int(video.get("height", 0))) != (1080, 1920):
              raise SystemExit("QC failed: expected 1080x1920")
          duration = float(probe.get("format", {}).get("duration", 0) or 0)
          if not 59.0 <= duration <= 60.5:
              raise SystemExit(f"QC failed: duration {duration:.2f}s")
          audio_duration = float(audio.get("duration", 0) or 0)
          if audio_duration < 58.5:
              raise SystemExit(f"QC failed: audio duration {audio_duration:.2f}s")
          if int(audio.get("sample_rate", 0)) != 44100:
              raise SystemExit("QC failed: expected 44100 Hz audio")
          visual_qc = json.loads(Path("output/visual_qc.json").read_text())
          if len(visual_qc) != 8:
              raise SystemExit(f"QC failed: expected 8 visual records, got {len(visual_qc)}")
          generated = sum(1 for x in visual_qc if x.get("generated"))
          print(f"PRODUCTION QC PASSED: 1080x1920, {duration:.2f}s, audio {audio_duration:.2f}s, visuals {generated}/8; fallback upload allowed")
          PY
          ls -lh output/what_if_daily.mp4 output/metadata.json output/visual_qc.json

      - name: Save topic history
        if: always()
        run: |
          if [ ! -f topic_history.json ]; then
            echo "No topic history file created; nothing to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
          else
            git commit -m "Reserve WHAT IF DAILY topic"
            git push
          fi

      - name: Cleanup generated files
        if: always()
        run: rm -rf output
