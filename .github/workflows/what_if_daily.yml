name: WHAT IF DAILY

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST
    - cron: "30 13 * * *"

    # 10:30 PM IST
    - cron: "0 17 * * *"

permissions:
  contents: write
concurrency:
  group: what-if-daily-topic
  cancel-in-progress: false
jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash

      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}

      # The schedule itself determines which slot this is.
      RUN_SLOT: ${{ github.event.schedule == '30 13 * * *' && '0' || '1' }}

      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing"
            exit 1
          fi

          if [ -z "$YOUTUBE_OAUTH_JSON" ]; then
            echo "YOUTUBE_OAUTH_JSON is missing"
            exit 1
          fi

          echo "Required secrets are present."

      - name: Generate WHAT IF DAILY video
        run: |
          python src/what_if_daily.py

      - name: Verify generated files
        run: |
          test -f output/what_if_daily.mp4
          test -f output/metadata.json

          echo "Generated files verified:"
          ls -lh output/what_if_daily.mp4
          ls -lh output/metadata.json
      - name: Save topic history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topic_history.json

          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
          else
            git commit -m "Update WHAT IF DAILY topic history"
            git push
          fi
      - name: Cleanup generated files
        if: always()
        run: |
          rm -rf output
          echo "Temporary generated files removed."

      - name: Post Setup Python
        if: always()
        run: |
          python --version

      - name: Post Checkout repository
        if: always()
        run: |
          echo "WHAT IF DAILY workflow completed."
