name: WHAT IF DAILY

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST
    - cron: "30 13 * * *"
    # 10:30 PM IST
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: what-if-daily-topic
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CLOUDFLARE_IMAGE_FALLBACK_MODEL: "@cf/bytedance/stable-diffusion-xl-lightning"
      VISUALS_ENABLED: "true"
      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
      RUN_SLOT: ${{ github.event.schedule == '30 13 * * *' && '0' || '1' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY is missing"; exit 1; }
          test -n "$YOUTUBE_OAUTH_JSON" || { echo "YOUTUBE_OAUTH_JSON is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          echo "All required secrets are present."

      - name: Normalize production pipeline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/what_if_daily_v2.py")
          s = p.read_text(encoding="utf-8")

          # Replace the whole mix_audio function by function boundaries, not fragile text matching.
          start = s.find("def mix_audio(")
          end = s.find("\ndef write_metadata", start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate mix_audio function boundaries")

          new_mix = '''def mix_audio(video, narration_sfx, music):
              audio = AUDIO / "final_audio.m4a"
              fc = (
                  "[0:a]volume=1.0,asplit=2[n][sc];"
                  "[1:a]volume=0.68[m];"
                  "[m][sc]sidechaincompress=threshold=0.04:ratio=5:attack=18:release=260:makeup=1:mix=0.82[duck];"
                  "[n][duck]amix=inputs=2:duration=first:dropout_transition=0.8,"
                  "loudnorm=I=-15.5:TP=-1.2:LRA=8[a]"
              )
              run(["ffmpeg", "-y", "-i", str(narration_sfx), "-i", str(music),
                   "-filter_complex", fc, "-map", "[a]", "-t", str(DURATION),
                   "-ar", "44100", "-c:a", "aac", "-b:a", "192k", str(audio)])
              run(["ffmpeg", "-y", "-i", str(video), "-i", str(audio), "-map", "0:v:0",
                   "-map", "1:a:0", "-c:v", "copy", "-c:a", "aac", "-shortest", str(VIDEO)])

          '''
          s = s[:start] + new_mix + s[end + 1:]

          s = s.replace('filters.append("[2:a]volume=1.0[t]")',
                        'filters.append("[2:a]adelay=6950|6950,volume=1.0[t]")', 1)

          s = s.replace('overlay_frame(frame, scene["on_screen"], scene["narration"], index, (fi + 1) / 18)',
                        'overlay_frame(frame, scene["on_screen"], scene["narration"], index, min(1.0, (fi + 1) / 5.0))', 1)

          # Gemini occasionally returns a tiny overage (117-120 words). Trim only the excess,
          # never taking a scene below 12 words, then enforce the real 104-116 production limit.
          old = '''    total_words = sum(len(s["narration"].split()) for s in scenes)
          if not 104 <= total_words <= 116:
              raise RuntimeError(f"Narration word count {total_words}; expected 104-116")'''
          new = '''    total_words = sum(len(s["narration"].split()) for s in scenes)
          if 117 <= total_words <= 120:
              excess = total_words - 116
              for scene in reversed(scenes):
                  words = scene["narration"].split()
                  removable = max(0, len(words) - 12)
                  take = min(removable, excess)
                  if take:
                      scene["narration"] = " ".join(words[:-take])
                      excess -= take
                  if excess == 0:
                      break
              total_words = sum(len(s["narration"].split()) for s in scenes)
              print(f"Normalized narration word count to {total_words} words.")
          if not 104 <= total_words <= 116:
              raise RuntimeError(f"Narration word count {total_words}; expected 104-116")'''
          if old not in s:
              raise SystemExit("Could not locate narration word-count validation block")
          s = s.replace(old, new, 1)

          # Add a hard pre-upload QC gate. Upload is impossible unless the final MP4 is valid.
          marker = "\ndef main():\n"
          if marker not in s:
              raise SystemExit("Could not locate main()")
          qc = '''\ndef production_qc(story):
              if not VIDEO.exists() or VIDEO.stat().st_size < 100000:
                  raise RuntimeError("QC failed: final MP4 missing or suspiciously small")
              if not METADATA.exists() or METADATA.stat().st_size == 0:
                  raise RuntimeError("QC failed: metadata.json missing or empty")
              probe = subprocess.run([
                  "ffprobe", "-v", "error", "-show_streams", "-show_format",
                  "-of", "json", str(VIDEO)
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if probe.returncode != 0:
                  raise RuntimeError("QC failed: ffprobe could not read final MP4")
              info = json.loads(probe.stdout)
              streams = info.get("streams", [])
              video_stream = next((x for x in streams if x.get("codec_type") == "video"), None)
              audio_stream = next((x for x in streams if x.get("codec_type") == "audio"), None)
              if not video_stream or not audio_stream:
                  raise RuntimeError("QC failed: final MP4 must contain video and audio")
              if int(video_stream.get("width", 0)) != WIDTH or int(video_stream.get("height", 0)) != HEIGHT:
                  raise RuntimeError(f"QC failed: expected {WIDTH}x{HEIGHT} video")
              duration = float(info.get("format", {}).get("duration", 0) or 0)
              if not 59.0 <= duration <= 60.5:
                  raise RuntimeError(f"QC failed: final duration {duration:.2f}s is outside 59.0-60.5s")
              audio_duration = float(audio_stream.get("duration", duration) or duration)
              if audio_duration < 58.5:
                  raise RuntimeError(f"QC failed: audio duration {audio_duration:.2f}s is too short")
              if int(audio_stream.get("sample_rate", 0)) != 44100:
                  raise RuntimeError("QC failed: expected 44.1 kHz final audio")
              words = sum(len(x.get("narration", "").split()) for x in story.get("scenes", []))
              if not 104 <= words <= 116:
                  raise RuntimeError(f"QC failed: narration word count {words}")
              print(f"PRODUCTION QC PASSED: {WIDTH}x{HEIGHT}, {duration:.2f}s, audio {audio_duration:.2f}s, {words} words")
\n'''
          s = s.replace(marker, qc + marker, 1)

          old_upload = '''    write_metadata(story)
              upload_youtube(story)'''
          if old_upload not in s:
              raise SystemExit("Could not locate upload call for QC gate")
          s = s.replace(old_upload, '''    write_metadata(story)
              production_qc(story)
              upload_youtube(story)''', 1)

          p.write_text(s, encoding="utf-8")
          print("Production pipeline normalized and pre-upload QC installed.")
          PY

          git diff --check
          git diff -- src/what_if_daily_v2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/what_if_daily_v2.py
          git commit -m "Add production pre-upload QC gate" || true
          git push

      - name: Validate workflow and Python
        run: |
          python - <<'PY'
          import yaml
          with open(".github/workflows/what_if_daily.yml", "r", encoding="utf-8") as f:
              yaml.safe_load(f)
          print("Workflow YAML parse OK.")
          PY
          python -m py_compile src/what_if_daily_v2.py
          echo "Python V2 syntax OK."

      - name: Audio filter smoke test
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:duration=3" \
            -f lavfi -i "sine=frequency=120:duration=3" \
            -filter_complex "[0:a]volume=1.0,asplit=2[n][sc];[1:a]volume=0.68[m];[m][sc]sidechaincompress=threshold=0.04:ratio=5:attack=18:release=260:makeup=1:mix=0.82[duck];[n][duck]amix=inputs=2:duration=first:dropout_transition=0.8,loudnorm=I=-15.5:TP=-1.2:LRA=8[a]" \
            -map "[a]" -t 3 -f null -
          echo "FFmpeg audio sidechain smoke test PASSED."

      - name: Generate WHAT IF DAILY V2 video
        run: |
          python src/what_if_daily_v2.py

      - name: Verify generated files
        run: |
          test -s output/what_if_daily.mp4
          test -s output/metadata.json
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration \
            -of default=noprint_wrappers=1 output/what_if_daily.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,duration \
            -of default=noprint_wrappers=1 output/what_if_daily.mp4
          echo "Generated files verified."
          ls -lh output/what_if_daily.mp4
          ls -lh output/metadata.json

      - name: Save topic history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if git diff --cached --quiet; then
            echo "No topic history changes to commit."
          else
            git commit -m "Update WHAT IF DAILY topic history"
            git push
          fi

      - name: Cleanup generated files
        if: always()
        run: |
          rm -rf output
          echo "Temporary generated files removed."

      - name: Post Setup Python
        if: always()
        run: python --version

      - name: Post Checkout repository
        if: always()
        run: echo "WHAT IF DAILY workflow completed."
