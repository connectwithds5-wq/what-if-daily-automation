name: PIXAZO WHAT IF MANUAL TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixazo-test:
    runs-on: ubuntu-latest
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}

    steps:
      - name: Checkout isolated Pixazo test branch
        uses: actions/checkout@v4
        with:
          ref: test/pixazo-video-local

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate Pixazo secret
        run: |
          if [ -z "$PIXAZO_API_KEY" ]; then
            echo "PIXAZO_API_KEY secret is missing"
            exit 1
          fi
          echo "PIXAZO_API_KEY is configured"

      - name: Generate isolated What-If video
        run: python src/pixazo_video_test.py

      - name: Upload Pixazo test video
        uses: actions/upload-artifact@v4
        with:
          name: pixazo-what-if-test
          path: output/pixazo_test/pixazo_ltx_what_if_test.mp4
          if-no-files-found: error
