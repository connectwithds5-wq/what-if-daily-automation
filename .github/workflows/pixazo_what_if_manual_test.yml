name: PIXAZO WHAT IF MANUAL TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixazo-test:
    runs-on: ubuntu-latest
    env:
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout isolated Pixazo test branch
        uses: actions/checkout@v4
        with:
          ref: test/pixazo-video-local

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install only test dependencies
        run: pip install requests edge-tts google-genai google-api-python-client google-auth-oauthlib google-auth pillow

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Validate secrets
        run: |
          test -n "$PIXAZO_API_KEY" || (echo "PIXAZO_API_KEY secret is missing" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY secret is missing" && exit 1)
          echo "Required secrets are configured"

      - name: Generate FAST Pixazo What-If video
        run: python src/pixazo_full_test_fast.py

      - name: Upload full Pixazo test video
        uses: actions/upload-artifact@v4
        with:
          name: pixazo-what-if-full-test-fast
          path: output/pixazo_full_test_fast/pixazo_what_if_full_test.mp4
          if-no-files-found: error
