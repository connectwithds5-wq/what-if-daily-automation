name: WHAT IF DAILY

on:
  workflow_dispatch:

  schedule:
    # 7:00 PM IST
    - cron: "30 13 * * *"

    # 10:30 PM IST
    - cron: "0 17 * * *"

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash

      YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}

      # The schedule itself determines which slot this is.
      RUN_SLOT: ${{ github.event.schedule == '30 13 * * *' && '0' || '1' }}

      PYTHONUNBUFFERED: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing"
            exit 1
          fi

          if [ -z "$YOUTUBE_OAUTH_JSON" ]; then
            echo "YOUTUBE_OAUTH_JSON is missing"
            exit 1
          fi

          echo "Required secrets are present."

      - name: Generate WHAT IF DAILY video
        run: |
          python src/what_if_daily.py

      - name: Verify generated files
        run: |
          test -f output/what_if_daily.mp4
          test -f output/metadata.json

          echo "Generated files verified:"
          ls -lh output/what_if_daily.mp4
          ls -lh output/metadata.json

      - name: Upload to YouTube
        run: |
          python - <<'PY'
          import os
          import json

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          oauth = json.loads(
              os.environ["YOUTUBE_OAUTH_JSON"]
          )

          credentials = Credentials(
              token=None,
              refresh_token=oauth["refresh_token"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=oauth["client_id"],
              client_secret=oauth["client_secret"],
              scopes=[
                  "https://www.googleapis.com/auth/youtube.upload"
              ]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials
          )

          with open(
              "output/metadata.json",
              "r",
              encoding="utf-8"
          ) as f:
              metadata = json.load(f)

          title = metadata["title"]

          hashtags = " ".join(
              metadata.get("hashtags", [])
          )

          description = (
              metadata.get("description", "")
              + "\n\n"
              + hashtags
              + "\n\n"
              + "WHAT IF DAILY - IMAGINE. WATCH. WONDER."
          )

          tags = metadata.get(
              "keywords",
              []
          )

          body = {
              "snippet": {
                  "title": title,
                  "description": description,
                  "tags": tags[:30],
                  "categoryId": "27",
                  "defaultLanguage": "en"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload(
              "output/what_if_daily.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body=body,
              media_body=media
          )

          response = None

          while response is None:
              status, response = request.next_chunk()

              if status:
                  print(
                      "Upload progress:",
                      int(status.progress() * 100),
                      "%"
                  )

          video_id = response["id"]

          print("")
          print("======================================")
          print("YOUTUBE UPLOAD SUCCESS")
          print("Video ID:", video_id)
          print(
              "URL:",
              "https://www.youtube.com/shorts/" + video_id
          )
          print("======================================")
          PY

      - name: Cleanup generated files
        if: always()
        run: |
          rm -rf output
          echo "Temporary generated files removed."

      - name: Post Setup Python
        if: always()
        run: |
          python --version

      - name: Post Checkout repository
        if: always()
        run: |
          echo "WHAT IF DAILY workflow completed."
